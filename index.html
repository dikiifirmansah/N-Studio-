<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>N-Studio</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#080808"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="N-Studio">
<style>
:root{--bg:#080808;--cd:#242424;--ln:#383838;--tx:#eee;--mu:#aaa;--bt:#f1f1f1;--bx:#111;--in:#444}
:root[data-theme=light]{--bg:#f6f6f3;--cd:#e9e9e4;--ln:#d2d2cc;--tx:#161616;--mu:#666;--bt:#161616;--bx:#fff;--in:#bdbdb6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}#app{max-width:520px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px 100px;display:flex;flex-direction:column;gap:9px}
body.ck #app{gap:6px}body.ck .card{padding:8px 10px}
.head{display:flex;align-items:center;gap:10px;min-height:32px;font-weight:700}.grow{flex:1;min-width:0}.ib{display:grid;place-items:center;width:34px;height:34px}
.title{font-size:20px;font-weight:750;line-height:1.2}.sub{color:var(--mu);font-size:13px;line-height:1.55}.tiny{color:var(--mu);font-size:11px}
.card{border:1px solid var(--ln);border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}.card .sub{font-size:12px;line-height:1.4}.card>b,.card .row b{font-size:14px}.card.fill{background:var(--cd);border-color:var(--cd)}.card.sel{border-color:var(--tx)}
.row{display:flex;align-items:center;gap:9px}.row2{display:flex;gap:8px}.row2>*{flex:1}
.btn{border:1px solid var(--in);background:none;color:var(--tx);border-radius:22px;padding:10px 14px;font:650 13px system-ui;cursor:pointer;text-align:center}.btn.solid{background:var(--bt);color:var(--bx);border-color:var(--bt)}
.mini{border:1px solid var(--in);background:none;color:var(--tx);border-radius:14px;padding:3px 9px;font:600 11px system-ui;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px}.lb{font-size:13px;font-weight:650}
textarea,select,.in{width:100%;background:none;color:var(--tx);border:1px solid var(--in);border-radius:10px;padding:11px;font:14px/1.5 system-ui}select{padding:7px;font-size:12px;color:var(--mu)}
option{background:var(--bg);color:var(--tx)}textarea:focus,select:focus,.in:focus{outline:2px solid var(--tx);outline-offset:1px}
.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:9px 3px;border-radius:9px;border:0;background:var(--cd);color:var(--tx);font:13px system-ui;cursor:pointer}.tabs .sel{background:var(--bt);color:var(--bx)}
details.sec{border:1px solid var(--ln);border-radius:13px;padding:10px 12px}details.sec details.sec{margin-top:8px}details>summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary b{flex:1}
.l1>summary b{font-size:17px}.kv{display:flex;flex-direction:column;padding:7px 0;border-top:1px solid var(--ln);margin-top:6px}.kv span{font-size:11px;color:var(--mu)}details p{margin:6px 0 0;font-size:14px}
pre.source{white-space:pre-wrap;word-break:break-word;font:12px/1.7 ui-monospace,monospace;border:1px solid var(--ln);border-radius:13px;padding:12px;margin:0}
.ol{padding:6px 0;border-bottom:1px solid var(--ln)}.err{color:#e5484d;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;justify-content:space-around;max-width:520px;margin:auto;padding:9px 0 calc(9px + env(safe-area-inset-bottom));font-size:11px;color:var(--mu)}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}nav a.on{color:var(--tx);font-weight:700}
#tt{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--bt);color:var(--bx);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}#tt.on{opacity:1}
.num{color:var(--mu);font-size:12px;min-width:20px}.chk{width:20px;height:20px;border:1px solid var(--mu);border-radius:5px;display:grid;place-items:center;flex:none}.chk.on{background:var(--bt);color:var(--bx)}
.preview{white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace;color:var(--mu);max-height:260px;overflow:auto}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5}.pn{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--bg);border:1px solid var(--ln);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:6;animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}
.op{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:12px;padding:13px 14px;font:15px system-ui;cursor:pointer;text-align:left}.op.on{border-color:var(--tx);background:var(--cd)}.op.dg{background:#e5484d;border-color:#e5484d;color:#fff;justify-content:center;font-weight:650}
.pk{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:1px solid var(--in);background:none;color:var(--mu);border-radius:10px;padding:10px 11px;font:13px system-ui;cursor:pointer;text-align:left}svg{flex:none;vertical-align:-4px}.btn,.mini{display:inline-flex;align-items:center;justify-content:center;gap:7px}.tabs a{flex:1;padding:9px 3px;border-radius:9px;background:var(--cd);color:var(--tx);font-size:13px;text-align:center}.tabs a.sel{background:var(--bt);color:var(--bx)}
.pj{background:none;border:0;color:var(--tx);font:700 16px system-ui;display:flex;align-items:center;gap:6px;text-align:left;padding:0;cursor:pointer;min-width:0}.pj span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico svg{width:18px;height:18px}.ico{width:32px;height:32px;border-radius:10px;background:var(--cd);display:grid;place-items:center;flex:none}.card.fill .ico{background:var(--bg)}
.lr{display:flex;align-items:center;gap:2px}.tip{border:0;background:none;color:var(--mu);width:26px;height:26px;display:grid;place-items:center;cursor:pointer;border-radius:50%;flex:none;padding:0}.tip:hover{color:var(--tx)}
#tp{position:fixed;z-index:9;background:var(--bt);color:var(--bx);padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 24px rgba(0,0,0,.35)}#tp.on{opacity:1;pointer-events:auto}
.bar{height:4px;border-radius:3px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--tx);border-radius:3px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--in);background:none;color:var(--tx);border-radius:16px;padding:6px 11px;font:600 12px system-ui;cursor:pointer}span.chip{cursor:default;font-weight:500;padding:3px 9px}.chip.on{background:var(--bt);color:var(--bx);border-color:var(--bt)}.chip.more{border-style:dashed;border-color:var(--tx)}
.tabs button,.tabs a{display:flex;align-items:center;justify-content:center;gap:5px}
.pn.dr{max-height:88vh;padding-bottom:0}.dh{display:flex;align-items:center;gap:6px}.dh b{flex:1;font-size:17px}#dbody{overflow:auto;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;padding-bottom:8px}#dl{display:flex;flex-direction:column;gap:7px}
.dg2{font-size:11px;color:var(--mu);margin-top:8px;text-transform:uppercase;letter-spacing:.05em;font-weight:650}
.dop{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:12px;padding:10px 12px;font:14px system-ui;cursor:pointer;width:100%}.dop.on{border-color:var(--tx);background:var(--cd)}.dop .t{flex:1;min-width:0}.dop b{display:block;font-weight:650}.dop small{display:block;color:var(--mu);font-size:12px;line-height:1.4}.dop .ico{width:38px;height:38px}.dop.on .ico{background:var(--bg)}
.df{padding:10px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
@media(hover:hover){.card[href]:hover,.card[role=button]:hover,.dop:hover,.chip:hover{border-color:var(--tx)}}
.card,.dop,.chip{transition:border-color .15s,transform .1s}.card[href]:active,.card[role=button]:active,.dop:active,.chip:active{transform:scale(.985)}
@media(prefers-reduced-motion:reduce){.pn{animation:none}.card,.dop,.chip{transition:none}}
.fl{animation:fl .6s ease-out}@keyframes fl{from{background:var(--cd)}}@media(prefers-reduced-motion:reduce){.fl{animation:none}}
details.hw{padding:0}details.hw>summary{padding:10px 12px;gap:9px}details.hw>summary .chev{transition:transform .15s;margin-left:auto}details.hw[open]>summary .chev{transform:rotate(180deg)}details.hw .hb{padding:0 12px 12px;display:flex;flex-direction:column;gap:7px}details.hw ol{margin:0;padding-left:18px;font-size:12.5px;color:var(--mu);line-height:1.5}details.hw ol b{color:var(--tx);font-weight:650}

10. Jika ada bagian yang tidak cocok dengan kategori lain, masukkan ke "Catatan Lainnya".

12. Jika pengelompokan hanya dugaan, beri tanda "Kategori sementara".
13. Jika suatu kolom di sumber memang kosong, tulis "Belum diisi". Jangan menciptakan jawaban.
14. Keluarkan hanya Markdown hasil perapian, tanpa komentar pembuka atau penutup.
